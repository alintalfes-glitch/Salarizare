<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcul orientativ salariu polițist penitenciar</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --primary: #1e3a5f;
            --primary-light: #2a5298;
            --accent: #e8a33d;
            --text: #1c2b3a;
            --muted: #5b6f82;
            --border: #d8e1ec;
            --shadow: 0 6px 18px rgba(0,0,0,0.05);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 30px;
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; color: #34495e; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            font-family: inherit;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(42,82,152,0.1);
            background: #fff;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--primary);
            color: #fff;
            text-align: center;
        }
        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(30,58,95,0.3);
        }
        .result-section {
            background: #f8fafc;
            border-left: 4px solid var(--primary);
            padding: 16px 18px;
            border-radius: var(--radius-sm);
            margin-top: 20px;
        }
        .result-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .result-line:last-child { border-bottom: none; }
        .result-line .label { font-weight: 500; color: #3b4a5a; }
        .result-line .value { font-weight: 700; font-variant-numeric: tabular-nums; }
        .result-line.total {
            background: #e8eff8;
            border-radius: 4px;
            padding: 8px 10px;
            font-weight: 700;
            font-size: 1.05rem;
        }
        .result-line.total .value { color: var(--primary); font-size: 1.2rem; }
        .hidden { display: none; }
        .hint { font-size: 0.78rem; color: var(--muted); font-weight: 400; }
        .alert {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            margin-bottom: 15px;
            font-weight: 500;
            font-size: 0.9rem;
            background: #e3f2fd;
            border-left: 4px solid #1e88e5;
            color: #0d47a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Calcul orientativ salariu</h1>
        <div class="alert">Introduceți datele și apăsați „Calculează” pentru estimarea salariului net.</div>

        <div class="form-grid">
            <div class="form-group">
                <label>Corp profesional</label>
                <select id="corp" onchange="schimbaCorp()">
                    <option value="agenti" selected>Agenți</option>
                    <option value="ofiteri">Ofițeri</option>
                </select>
            </div>
            <div class="form-group">
                <label>Grad profesional</label>
                <select id="grad-profesional" onchange="autoCompleteGrad()">
                    <!-- Populat dinamic -->
                </select>
            </div>
            <div class="form-group">
                <label>Salariu grad profesional (lei)</label>
                <input type="number" id="salariu-grad" value="2145" min="0" step="1">
            </div>
            <div class="form-group">
                <label>Salariu de funcție bază (SF0)</label>
                <input type="number" id="sf0" value="4000" min="0" step="10">
                <div class="hint">Salariul de funcție la gradația 0.</div>
            </div>
            <div class="form-group">
                <label>Gradație (0-7)</label>
                <select id="gradatie">
                    <option value="0">0 - fără</option>
                    <option value="1" selected>1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                </select>
            </div>
            <div class="form-group">
                <label>Specialist de clasă</label>
                <select id="specialist">
                    <option value="0">Fără specialist</option>
                    <option value="3">Clasa III (2,5%)</option>
                    <option value="2">Clasa II (5%)</option>
                    <option value="1" selected>Clasa I (7,5%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Structură centrală (majorare 12,5%)</label>
                <select id="structura-centrala">
                    <option value="nu" selected>Nu</option>
                    <option value="da">Da</option>
                </select>
            </div>
            <div class="form-group">
                <label>Control financiar preventiv (CFP)</label>
                <select id="cfp">
                    <option value="nu" selected>Nu</option>
                    <option value="da">Da</option>
                </select>
            </div>
            <div class="form-group">
                <label>Audit</label>
                <select id="audit">
                    <option value="nu" selected>Nu</option>
                    <option value="da">Da</option>
                </select>
            </div>
            <div class="form-group">
                <label>Proiecte fonduri europene</label>
                <select id="proiecte" onchange="toggleProiecte()">
                    <option value="nu" selected>Nu</option>
                    <option value="da">Da</option>
                </select>
            </div>
        </div>

        <div id="proiecte-detalii" class="hidden form-grid">
            <div class="form-group">
                <label>Procent proiect (%)</label>
                <input type="number" id="proiecte-procent" value="50" min="0" max="50" step="0.1">
            </div>
            <div class="form-group">
                <label>Ore proiect</label>
                <input type="number" id="proiecte-ore" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Total ore lucrătoare</label>
                <input type="number" id="proiecte-total-ore" value="168" min="1">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Compensație risc / pericol (%)</label>
                <input type="number" id="risc-procent" value="30" min="0" max="30" step="0.5">
                <div class="hint">0 = nu se acordă.</div>
            </div>
            <div class="form-group">
                <label>Funcție de comandă</label>
                <select id="comanda" onchange="toggleComandaDetalii()">
                    <option value="nu" selected>Nu</option>
                    <option value="sef_formatiune_I">Șef formațiune I (10%)</option>
                    <option value="sef_formatiune_II">Șef formațiune II (5%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Salariu de comandă (%)</label>
                <input type="number" id="comanda-procent" value="0" min="0" max="25" step="0.1" disabled>
            </div>
            <div class="form-group">
                <label>Număr subordonați</label>
                <input type="number" id="subordonati" value="3" min="0">
            </div>
            <div class="form-group">
                <label>Ore suplimentare / sărbători (lei)</label>
                <input type="number" id="ore-valoare" value="0" min="0" step="1">
            </div>
            <div class="form-group">
                <label>Alte majorări (%)</label>
                <input type="number" id="alte-majorari" value="0" min="0" step="0.1">
            </div>
            <div class="form-group">
                <label>Spor condiții periculoase (%)</label>
                <input type="number" id="periculoase-procent" value="0" min="0" max="15" step="0.5">
            </div>
            <div class="form-group">
                <label>Spor condiții grele (%)</label>
                <input type="number" id="grele-procent" value="0" min="0" max="15" step="0.5">
            </div>
            <div class="form-group">
                <label>Spor noapte (%)</label>
                <input type="number" id="noapte-procent" value="0" min="0" max="25" step="0.5">
            </div>
            <div class="form-group">
                <label>Spor confidențialitate (%)</label>
                <input type="number" id="confidentialitate-procent" value="0" min="0" max="25" step="0.5">
            </div>
            <div class="form-group">
                <label>Spor studii superioare (agenți) (%)</label>
                <input type="number" id="studii-superioare-procent" value="0" min="0" max="25" step="0.5">
            </div>
            <div class="form-group">
                <label>Deducere personală (lei)</label>
                <input type="number" id="deducere" value="0" min="0" step="10">
            </div>
        </div>

        <button class="btn" onclick="calculeaza()">📊 Calculează salariul</button>

        <div id="rezultat" class="result-section hidden">
            <!-- Rezultatul va fi afișat aici -->
        </div>
    </div>

    <script>
        // Salariile de grad pentru agenți și ofițeri (OUG 26/2024)
        const salariiGrad = {
            agenti: {
                agent: 1980,
                agent_principal: 2079,
                agent_sef_adjunct: 2145,
                agent_sef: 2211,
                agent_sef_principal: 2277
            },
            ofiteri: {
                subinspector: 2310,
                inspector: 2376,
                inspector_principal: 2442,
                subcomisar: 2508,
                comisar: 2574,
                comisar_sef: 2640
            }
        };

        function schimbaCorp() {
            const corp = document.getElementById('corp').value;
            const gradSelect = document.getElementById('grad-profesional');
            gradSelect.innerHTML = '';
            const grade = Object.keys(salariiGrad[corp]);
            grade.forEach(grad => {
                const opt = document.createElement('option');
                opt.value = grad;
                opt.textContent = grad.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                gradSelect.appendChild(opt);
            });
            // Setează primul grad ca implicit
            gradSelect.value = grade[0];
            autoCompleteGrad();
        }

        function autoCompleteGrad() {
            const corp = document.getElementById('corp').value;
            const grad = document.getElementById('grad-profesional').value;
            document.getElementById('salariu-grad').value = salariiGrad[corp][grad] || 0;
        }

        function toggleProiecte() {
            const val = document.getElementById('proiecte').value;
            document.getElementById('proiecte-detalii').classList.toggle('hidden', val !== 'da');
        }

        function toggleComandaDetalii() {
            const tip = document.getElementById('comanda').value;
            const procentInput = document.getElementById('comanda-procent');
            if (tip === 'sef_formatiune_I') {
                procentInput.value = 10;
                procentInput.disabled = false;
            } else if (tip === 'sef_formatiune_II') {
                procentInput.value = 5;
                procentInput.disabled = false;
            } else {
                procentInput.value = 0;
                procentInput.disabled = true;
            }
        }

        function aplicaGradatia(sf0, gradatie) {
            let sf = sf0;
            for (let i = 0; i < gradatie; i++) {
                sf *= 1.03; // 3% succesiv
            }
            return sf;
        }

        function formatLei(val) {
            return Number(val).toFixed(2).replace('.', ',') + ' lei';
        }

        function calculeaza() {
            // Citire valori
            const corp = document.getElementById('corp').value;
            const sf0 = parseFloat(document.getElementById('sf0').value) || 0;
            const gradatie = parseInt(document.getElementById('gradatie').value) || 0;
            const specialist = document.getElementById('specialist').value;
            const structuraCentrala = document.getElementById('structura-centrala').value === 'da';
            const cfp = document.getElementById('cfp').value === 'da';
            const audit = document.getElementById('audit').value === 'da';
            const proiecte = document.getElementById('proiecte').value === 'da';
            const proiecteProcent = proiecte ? (parseFloat(document.getElementById('proiecte-procent').value) || 0) : 0;
            const proiecteOre = proiecte ? (parseFloat(document.getElementById('proiecte-ore').value) || 0) : 0;
            const proiecteTotalOre = proiecte ? (parseFloat(document.getElementById('proiecte-total-ore').value) || 168) : 168;
            const riscProcent = parseFloat(document.getElementById('risc-procent').value) || 0;
            const comandaTip = document.getElementById('comanda').value;
            const comandaProcent = comandaTip !== 'nu' ? (parseFloat(document.getElementById('comanda-procent').value) || 0) : 0;
            const subordonati = parseInt(document.getElementById('subordonati').value) || 0;
            const oreValoare = parseFloat(document.getElementById('ore-valoare').value) || 0;
            const alteMajorariProcent = parseFloat(document.getElementById('alte-majorari').value) || 0;
            const periculoaseProcent = parseFloat(document.getElementById('periculoase-procent').value) || 0;
            const greleProcent = parseFloat(document.getElementById('grele-procent').value) || 0;
            const noapteProcent = parseFloat(document.getElementById('noapte-procent').value) || 0;
            const confidentialitateProcent = parseFloat(document.getElementById('confidentialitate-procent').value) || 0;
            const studiiSuperioareProcent = parseFloat(document.getElementById('studii-superioare-procent').value) || 0;
            const salariuGrad = parseFloat(document.getElementById('salariu-grad').value) || 0;
            const deducere = parseFloat(document.getElementById('deducere').value) || 0;

            // Verificare comandă: necesită minim 3 subordonați
            let comandaProcentFinal = 0;
            if (comandaTip !== 'nu' && subordonati >= 3) {
                comandaProcentFinal = comandaProcent;
            }

            // 1. Salariu funcție după gradație
            const sfGrad = aplicaGradatia(sf0, gradatie);

            // 2. Majorări pe bază SF grad
            const art19 = sfGrad * 0.075; // 7,5%
            const art23 = structuraCentrala ? sfGrad * 0.125 : 0;
            const specialistProcent = {0:0, 3:2.5, 2:5, 1:7.5}[specialist] || 0;
            const specialistVal = sfGrad * (specialistProcent / 100);
            const cfpVal = cfp ? sfGrad * 0.10 : 0;
            const auditVal = audit ? sfGrad * 0.10 : 0;
            const proiecteVal = proiecte ? (sfGrad * (proiecteProcent / 100) * (proiecteOre / proiecteTotalOre)) : 0;
            const alteMajorariVal = sfGrad * (alteMajorariProcent / 100);

            // 3. Salariu funcție majorat
            const sfMajorat = sfGrad + art19 + art23 + specialistVal + cfpVal + auditVal + proiecteVal + alteMajorariVal;

            // 4. Sporuri / compensații pe bază SF majorat
            const riscVal = sfMajorat * (riscProcent / 100);
            const periculoaseVal = sfMajorat * (periculoaseProcent / 100);
            const greleVal = sfMajorat * (greleProcent / 100);
            const noapteVal = sfMajorat * (noapteProcent / 100);
            const confidentialitateVal = sfMajorat * (confidentialitateProcent / 100);
            const studiiSuperioareVal = sfMajorat * (studiiSuperioareProcent / 100);

            // 5. Salariu de comandă
            const comandaVal = sfMajorat * (comandaProcentFinal / 100);

            // 6. Venit brut
            const venitBrut = sfMajorat + riscVal + periculoaseVal + greleVal + noapteVal + confidentialitateVal + studiiSuperioareVal + comandaVal + salariuGrad + oreValoare;

            // 7. Taxe
            const cas = venitBrut * 0.25;
            const cass = venitBrut * 0.10;
            let bazaImpozit = venitBrut - cas - cass;
            if (deducere > 0) bazaImpozit = Math.max(0, bazaImpozit - deducere);
            const impozit = bazaImpozit * 0.10;
            const salariuNet = venitBrut - cas - cass - impozit;

            // Afișare rezultat
            const rez = document.getElementById('rezultat');
            rez.classList.remove('hidden');
            rez.innerHTML = `
                <div class="result-line"><span class="label">Salariu funcție după gradație (${gradatie} x 3%)</span><span class="value">${formatLei(sfGrad)}</span></div>
                <div class="result-line"><span class="label">Majorare art. 19 (7,5%)</span><span class="value">${formatLei(art19)}</span></div>
                ${structuraCentrala ? `<div class="result-line"><span class="label">Majorare art. 23 (12,5%)</span><span class="value">${formatLei(art23)}</span></div>` : ''}
                ${specialistProcent > 0 ? `<div class="result-line"><span class="label">Specialist clasa ${specialist} (${specialistProcent}%)</span><span class="value">${formatLei(specialistVal)}</span></div>` : ''}
                ${cfp ? `<div class="result-line"><span class="label">CFP (10%)</span><span class="value">${formatLei(cfpVal)}</span></div>` : ''}
                ${audit ? `<div class="result-line"><span class="label">Audit (10%)</span><span class="value">${formatLei(auditVal)}</span></div>` : ''}
                ${proiecte ? `<div class="result-line"><span class="label">Proiecte (${proiecteProcent}%, ${proiecteOre}/${proiecteTotalOre} ore)</span><span class="value">${formatLei(proiecteVal)}</span></div>` : ''}
                ${alteMajorariVal > 0 ? `<div class="result-line"><span class="label">Alte majorări (${alteMajorariProcent}%)</span><span class="value">${formatLei(alteMajorariVal)}</span></div>` : ''}
                <div class="result-line total"><span class="label">SALARIU FUNCȚIE MAJORAT</span><span class="value">${formatLei(sfMajorat)}</span></div>
                ${riscVal > 0 ? `<div class="result-line"><span class="label">Compensație risc (${riscProcent}%)</span><span class="value">${formatLei(riscVal)}</span></div>` : ''}
                ${periculoaseVal > 0 ? `<div class="result-line"><span class="label">Spor condiții periculoase (${periculoaseProcent}%)</span><span class="value">${formatLei(periculoaseVal)}</span></div>` : ''}
                ${greleVal > 0 ? `<div class="result-line"><span class="label">Spor condiții grele (${greleProcent}%)</span><span class="value">${formatLei(greleVal)}</span></div>` : ''}
                ${noapteVal > 0 ? `<div class="result-line"><span class="label">Spor noapte (${noapteProcent}%)</span><span class="value">${formatLei(noapteVal)}</span></div>` : ''}
                ${confidentialitateVal > 0 ? `<div class="result-line"><span class="label">Spor confidențialitate (${confidentialitateProcent}%)</span><span class="value">${formatLei(confidentialitateVal)}</span></div>` : ''}
                ${studiiSuperioareVal > 0 ? `<div class="result-line"><span class="label">Spor studii superioare (${studiiSuperioareProcent}%)</span><span class="value">${formatLei(studiiSuperioareVal)}</span></div>` : ''}
                ${comandaVal > 0 ? `<div class="result-line"><span class="label">Salariu de comandă (${comandaProcentFinal}%)</span><span class="value">${formatLei(comandaVal)}</span></div>` : ''}
                <div class="result-line"><span class="label">Salariu grad profesional</span><span class="value">${formatLei(salariuGrad)}</span></div>
                ${oreValoare > 0 ? `<div class="result-line"><span class="label">Ore suplimentare/sărbători</span><span class="value">${formatLei(oreValoare)}</span></div>` : ''}
                <div class="result-line total"><span class="label">VENIT BRUT</span><span class="value">${formatLei(venitBrut)}</span></div>
                <div class="result-line"><span class="label">CAS (25%)</span><span class="value">${formatLei(cas)}</span></div>
                <div class="result-line"><span class="label">CASS (10%)</span><span class="value">${formatLei(cass)}</span></div>
                ${deducere > 0 ? `<div class="result-line"><span class="label">Deducere personală</span><span class="value">${formatLei(deducere)}</span></div>` : ''}
                <div class="result-line"><span class="label">Impozit (10%)</span><span class="value">${formatLei(impozit)}</span></div>
                <div class="result-line total"><span class="label">SALARIU NET</span><span class="value">${formatLei(salariuNet)}</span></div>
            `;
        }

        // Inițializare
        schimbaCorp();
        toggleProiecte();
        toggleComandaDetalii();
    </script>
</body>
</html>
